name: Build LinkaLite (Android Legado)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Usamos o Java 8 / 11 para garantir compatibilidade com o SDK Manager e builds antigos do Gradle
      - name: Configurar Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # Instalação da plataforma antiga usando o SDK Manager oficial pré-instalado no Runner
      - name: Instalar Android SDK Legado (API 5 - Android 2.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-5" "platforms;android-9" "build-tools;25.0.3"

      - name: Dar permissão de execução ao Gradlew
        working-directory: ./LinkaLite
        run: chmod +x gradlew
        continue-on-error: true

      - name: Compilar APK com Gradle
        working-directory: ./LinkaLite
        run: ./gradlew assembleDebug

      - name: Guardar o APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkaLite-debug-apk
          path: LinkaLite/app/build/outputs/apk/debug/*.apk