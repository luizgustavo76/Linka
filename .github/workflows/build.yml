name: Build LinkaLite (Android Legado)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    # Usa Java 17 para executar o Gradle moderno sem erros de daemon
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Android SDK Legado (API 3 - Android 1.5)
      run: |
        sudo apt-get update
        sudo apt-get install -y lib32z1 lib32stdc++6

        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk

        # Download do SDK Tools
        wget -q https://dl.google.com/android/repository/sdk-tools-linux-3859397.zip
        unzip -q sdk-tools-linux-3859397.zip
        
        # Aceitar licenças e instalar API 3
        yes | ./tools/bin/sdkmanager --licenses
        ./tools/bin/sdkmanager "platforms;android-3" "build-tools;25.0.3"

    - name: Configurar Variáveis de Ambiente do Android SDK
      run: |
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/tools:$HOME/android-sdk/tools/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

    - name: Dar permissão de execução ao Gradlew
      working-directory: ./LinkaLite
      run: chmod +x gradlew
      continue-on-error: true

    # Forçamos o Gradle a ignorar qualquer 'org.gradle.java.home' hardcoded limpando a propriedade via CLI
    - name: Compilar APK com Gradle
      working-directory: ./LinkaLite
      run: ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME
      
    - name: Guardar o APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinkaLite-debug-apk
        path: LinkaLite/app/build/outputs/apk/debug/*.apk