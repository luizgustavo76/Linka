[workspace]
members = ["crates/linka-server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "AGPL-3"
publish = false

[workspace.dependencies]
# async
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }

# http
axum = { version = "0.8.9" }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
axum-extra = { version = "0.12.6", features = ["file-stream"] }
tower-http = { version = "0.7.1", features = ["compression-br", "decompression-br", "timeout", "cors", "csrf"] }

# security
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = { version = "2.2.0" }

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
ciborium = { version = "0.2.2" }

# database
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }
redis = { version = "1.8.2", features = ["connection-manager", "tokio-comp"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
object_store = { version = "0.14.2", features = ["aws"] }

# types
uuid = { version = "1.29.3", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }

# util
dotenvy = { version = "0.15.7" }

# logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# error handling
color-eyre = { version = "0.6.5" }
thiserror = { version = "2.0.21" }